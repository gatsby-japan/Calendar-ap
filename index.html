<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフト">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>シフトカレンダー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#f5f4ef;--fg:#1d2330;--sub:#7b8191;--line:#dedcd3;--card:#fff;
  --day:#f2b632;--day-t:#3a2a00;
  --night:#2f3f8f;--night-t:#fff;
  --ake:#b9b3e6;--ake-t:#2a2557;
  --off:#7fcfa6;--off-t:#0f3a26;
  --sun:#d6453d;--sat:#2f6fd0;--acc:#e8553d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171f;--fg:#eceef4;--sub:#8c93a6;--line:#2a2f3c;--card:#1d212c;
    --day:#e0a528;--night:#5566c9;--ake:#8f88cc;--ake-t:#14122e;--off:#58b88a;--acc:#ff7a62;
  }
}
:root[data-theme="dark"]{
  --bg:#14171f;--fg:#eceef4;--sub:#8c93a6;--line:#2a2f3c;--card:#1d212c;
  --day:#e0a528;--night:#5566c9;--ake:#8f88cc;--ake-t:#14122e;--off:#58b88a;--acc:#ff7a62;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  padding-bottom:calc(210px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px}
header h1{margin:0;font-size:22px;font-weight:900}
header .nav{display:flex;gap:8px}
header button{border:0;background:var(--card);width:44px;height:44px;border-radius:50%;font-size:18px;box-shadow:0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--night);outline-offset:2px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk{padding:0 6px;text-align:center;font-size:12px;color:var(--sub);font-weight:700}
.wk div{padding:6px 0}.wk div:first-child{color:var(--sun)}.wk div:last-child{color:var(--sat)}
.grid{padding:0 6px;gap:3px}
.cell{border:0;border-radius:10px;background:var(--card);min-height:68px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 0 0 1px var(--line)}
.cell.blank{background:transparent;box-shadow:none;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 3px;min-height:18px}
.d{font-size:12px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px}
.cell.sun .d{color:var(--sun)}.cell.sat .d{color:var(--sat)}
.cell.today .d{background:var(--fg);color:var(--bg)}
.dots{display:flex;gap:2px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cell.sel{box-shadow:0 0 0 2px var(--fg)}
.cell.cur{box-shadow:0 0 0 3px var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.chip{width:100%;border-radius:7px;font-size:13px;font-weight:900;padding:6px 0;text-align:center;min-height:28px}
.chip.day{background:var(--day);color:var(--day-t)}.chip.night{background:var(--night);color:var(--night-t)}
.chip.ake{background:var(--ake);color:var(--ake-t)}.chip.off{background:var(--off);color:var(--off-t)}
.panel{margin:12px 6px 0;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph b{font-size:16px;font-weight:900}
.ph .chip{width:auto;min-height:0;padding:3px 10px;font-size:12px}
.link{border:0;background:none;color:var(--sub);text-decoration:underline;padding:10px 4px;font-size:13px}
.ph .link{margin-left:auto}
.evs{list-style:none;margin:6px 0;padding:0}
.evs li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.evs li:first-child{border-top:0}
.evs .tm{color:var(--sub);font-size:13px;min-width:44px}
.evs .tx{flex:1;word-break:break-all}
.evs button{border:0;background:none;color:var(--sub);font-size:20px;width:36px;height:36px}
.none{color:var(--sub);font-size:13px;margin:8px 0}
.add{display:flex;gap:6px;margin-top:6px}
.add input{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px;font:inherit;font-size:16px}
.add #evt{flex:1}.add #evtime{width:110px}
.add button{border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:0 14px;font-weight:700}
.sum{display:flex;gap:6px;padding:14px 6px 0;flex-wrap:wrap}
.sum div{flex:1 1 0;min-width:64px;background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;box-shadow:0 0 0 1px var(--line)}
.sum b{display:block;font-size:20px;font-weight:900}.sum span{font-size:11px;color:var(--sub)}
.sum .work b{color:var(--night)}
.foot{display:flex;justify-content:space-between;padding:10px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto}
.primary{width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:18px;font-weight:900;padding:16px}
.hint{font-size:14px;font-weight:700;padding:0 2px 8px}.hint small{color:var(--sub);font-weight:400}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{border:0;border-radius:12px;padding:16px 0;font-size:16px;font-weight:900}
.pal button:active{transform:scale(.94)}
.pal .day{background:var(--day);color:var(--day-t)}.pal .night{background:var(--night);color:var(--night-t)}
.pal .ake{background:var(--ake);color:var(--ake-t)}.pal .off{background:var(--off);color:var(--off-t)}
.pal .erase{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.row2{display:flex;align-items:center;gap:8px;padding-top:8px}
.row2 .sec{border:0;background:var(--bg);border-radius:10px;padding:12px;font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
.row2 .done{margin-left:auto;border:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:12px 24px;font-weight:900;font-size:15px}
.row2 label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.row2 input{width:18px;height:18px}
.bk{margin:6px 6px 0;background:var(--card);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line)}
.bk b{font-size:14px;font-weight:900}
.bkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bkrow button{border:0;border-radius:10px;padding:14px 6px;background:var(--bg);font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
#modal .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:320px}
#mtext{white-space:pre-line;margin:0 0 16px;font-size:15px;line-height:1.6}
#modal .btns{display:flex;gap:8px}
#modal button{flex:1;border:0;border-radius:10px;padding:13px;font-weight:900;font-size:15px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
#modal #mok{background:var(--acc);color:#fff;box-shadow:none}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="nav"><button id="prev" aria-label="前の月">‹</button><button id="next" aria-label="次の月">›</button></div>
</header>
<div class="wk"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div class="grid" id="grid"></div>
<div class="panel" id="panel"></div>
<div class="sum" id="sum"></div>
<div class="foot"><button class="link" id="today">今日へ</button><button class="link" id="clear">この月のシフトをクリア</button></div>

<div class="bk">
  <b>バックアップ</b>
  <div class="bkrow"><button id="export">ファイルに保存</button><button id="import">ファイルから読み込む</button></div>
  <button class="link" id="undo" hidden>読み込む前のデータに戻す</button>
  <p class="none" id="bkmsg" role="status"></p>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<div id="modal" hidden><div class="box"><p id="mtext"></p><div class="btns"><button id="mno">キャンセル</button><button id="mok">OK</button></div></div></div>

<div class="bar"><div class="bar-in">
  <div id="barView"><button class="primary" id="startInput">シフト入力</button></div>
  <div id="barInput" hidden>
    <div class="hint" id="hint"></div>
    <div class="pal">
      <button class="day" data-t="day">日勤</button>
      <button class="night" data-t="night">夜勤</button>
      <button class="ake" data-t="ake">明け</button>
      <button class="off" data-t="off">休み</button>
      <button class="erase" data-t="erase">消す</button>
    </div>
    <div class="row2">
      <button class="sec" id="back">← 戻る</button>
      <label><input type="checkbox" id="auto">夜勤→翌日を明けに</label>
      <button class="done" id="done">完了</button>
    </div>
  </div>
</div></div>

<script>
const TYPES=[{k:'day',l:'日勤'},{k:'night',l:'夜勤'},{k:'ake',l:'明け'},{k:'off',l:'休み'}];
const LABEL=Object.fromEntries(TYPES.map(t=>[t.k,t.l]));
const WD='日月火水木金土';
let data={},ev={},auto=false,mode='view',sel=null,cur=null;
let view=new Date();view.setDate(1);

try{
  const s=JSON.parse(localStorage.getItem('shift-cal-v1')||'null');
  if(s){data=s.data||{};ev=s.ev||{};auto=!!s.auto;}
}catch(e){}
function save(){try{localStorage.setItem('shift-cal-v1',JSON.stringify({data,ev,auto}));}catch(e){}}

const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d);
const dateOf=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const kOf=dt=>key(dt.getFullYear(),dt.getMonth(),dt.getDate());
const shift=(k,n)=>{const dt=dateOf(k);dt.setDate(dt.getDate()+n);return kOf(dt);};
const fmt=k=>{const dt=dateOf(k);return (dt.getMonth()+1)+'月'+dt.getDate()+'日('+WD[dt.getDay()]+')';};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function goto(k){const dt=dateOf(k);if(dt.getFullYear()!==view.getFullYear()||dt.getMonth()!==view.getMonth())view=new Date(dt.getFullYear(),dt.getMonth(),1);}
const todayKey=()=>kOf(new Date());
sel=todayKey();

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $('title').textContent=y+'年'+(m+1)+'月';
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),tk=todayKey();
  const cnt={day:0,night:0,ake:0,off:0};
  let h='';
  for(let i=0;i<first;i++)h+='<div class="cell blank"></div>';
  for(let d=1;d<=days;d++){
    const k=key(y,m,d),v=data[k],dow=(first+d-1)%7,n=(ev[k]||[]).length;
    if(v)cnt[v]++;
    const cls=['cell',dow===0?'sun':'',dow===6?'sat':'',k===tk?'today':'',mode==='view'&&k===sel?'sel':'',mode==='input'&&k===cur?'cur':''].join(' ');
    h+=`<button class="${cls}" data-k="${k}" aria-label="${m+1}月${d}日 ${v?LABEL[v]:'未入力'}">
      <span class="top"><span class="d">${d}</span><span class="dots">${'<i></i>'.repeat(Math.min(n,3))}</span></span>
      <span class="chip ${v||''}">${v?LABEL[v]:''}</span></button>`;
  }
  $('grid').innerHTML=h;
  $('sum').innerHTML=`<div class="work"><b>${cnt.day+cnt.night}</b><span>出勤</span></div>`+TYPES.map(t=>`<div><b>${cnt[t.k]}</b><span>${t.l}</span></div>`).join('');
  $('barView').hidden=mode!=='view';
  $('barInput').hidden=mode!=='input';
  $('panel').hidden=mode!=='view'||!sel;
  $('undo').hidden=!prev;
  if(mode==='input')$('hint').innerHTML=`${fmt(cur)} に入力<br><small>日付をタップで開始位置を変更 → 下のボタンで入力すると次の日へ進む</small>`;
  if(mode==='view'&&sel)renderPanel();
}

function renderPanel(){
  const v=data[sel],list=(ev[sel]||[]).map((e,i)=>({...e,i})).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  $('panel').innerHTML=`
    <div class="ph"><b>${fmt(sel)}</b>${v?`<span class="chip ${v}">${LABEL[v]}</span>`:''}
      <button class="link" id="here">ここからシフト入力</button></div>
    ${list.length?`<ul class="evs">${list.map(e=>`<li><span class="tm">${e.time||''}</span><span class="tx">${esc(e.t)}</span><button data-i="${e.i}" aria-label="予定を削除">×</button></li>`).join('')}</ul>`:'<p class="none">予定はありません</p>'}
    <div class="add"><input id="evt" placeholder="予定を追加(例: 歯医者)" enterkeyhint="done"><input id="evtime" type="time" aria-label="時刻"><button id="evadd">追加</button></div>`;
}

function startInput(k){
  mode='input';
  cur=k||sel||(()=>{const t=todayKey();const dt=dateOf(t);return(dt.getMonth()===view.getMonth()&&dt.getFullYear()===view.getFullYear())?t:key(view.getFullYear(),view.getMonth(),1);})();
  goto(cur);render();
}
function apply(t){
  if(!cur)return;
  let step=1;
  if(t==='erase')delete data[cur];
  else{
    data[cur]=t;
    if(t==='night'&&auto){const nk=shift(cur,1);if(data[nk]!=='night'){data[nk]='ake';step=2;}}
  }
  cur=shift(cur,step);goto(cur);save();render();
}

$('grid').onclick=e=>{
  const c=e.target.closest('.cell');if(!c||c.classList.contains('blank'))return;
  if(mode==='input')cur=c.dataset.k;else sel=c.dataset.k;
  render();
};
$('panel').onclick=e=>{
  if(e.target.id==='here')return startInput(sel);
  const b=e.target.closest('button[data-i]');
  if(b){ev[sel].splice(+b.dataset.i,1);if(!ev[sel].length)delete ev[sel];save();render();return;}
  if(e.target.id==='evadd')addEv();
};
$('panel').onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='evt')addEv();};
function addEv(){
  const t=$('evt').value.trim();if(!t)return;
  (ev[sel]=ev[sel]||[]).push({t,time:$('evtime').value});
  save();render();
}
document.querySelector('.pal').onclick=e=>{const b=e.target.closest('button');if(b)apply(b.dataset.t);};
$('startInput').onclick=()=>startInput();
$('done').onclick=()=>{mode='view';sel=cur;render();};
$('back').onclick=()=>{cur=shift(cur,-1);goto(cur);render();};
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render();};
$('today').onclick=()=>{view=new Date();view.setDate(1);sel=todayKey();if(mode==='input')cur=sel;render();};
$('clear').onclick=async()=>{
  if(!await ask((view.getMonth()+1)+'月のシフトをすべて消しますか?\n(予定は消えません)','消す'))return;
  const pre=view.getFullYear()+'-'+p2(view.getMonth()+1)+'-';
  Object.keys(data).forEach(k=>{if(k.startsWith(pre))delete data[k];});
  save();render();
};
let prev=null;
try{prev=JSON.parse(localStorage.getItem('shift-cal-prev')||'null');}catch(e){}
function savePrev(){try{prev?localStorage.setItem('shift-cal-prev',JSON.stringify(prev)):localStorage.removeItem('shift-cal-prev');}catch(e){}}
let msgT;
function msg(t){$('bkmsg').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>{$('bkmsg').textContent='';},5000);}
function ask(text,ok){return new Promise(res=>{
  $('mtext').textContent=text;$('mok').textContent=ok||'OK';$('modal').hidden=false;
  const end=v=>{$('modal').hidden=true;$('mok').onclick=null;$('mno').onclick=null;res(v);};
  $('mok').onclick=()=>end(true);$('mno').onclick=()=>end(false);
});}

async function exportBackup(){
  const now=new Date();
  const name='shift-backup-'+now.getFullYear()+p2(now.getMonth()+1)+p2(now.getDate())+'.json';
  const body=JSON.stringify({app:'shift-cal',v:1,savedAt:now.toISOString(),data,ev},null,1);
  let dl=null;
  try{dl=window.claude?await claude.use('downloads'):null;}catch(e){}
  if(dl){
    try{await dl.save({filename:name,data:body});msg('保存しました');}
    catch(err){if(!err||err.code!=='declined')msg('保存できませんでした');}
    return;
  }
  if(!await ask('バックアップをファイルに保存しますか?\n保存先で iCloud Drive を選べます。','保存'))return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  msg('保存しました');
}
function clean(o){
  if(!o||o.app!=='shift-cal'||typeof o.data!=='object'||typeof o.ev!=='object'||!o.data||!o.ev)return null;
  const re=/^\d{4}-\d{2}-\d{2}$/,d={},e={};
  for(const k in o.data){if(re.test(k)&&Object.prototype.hasOwnProperty.call(LABEL,o.data[k]))d[k]=o.data[k];}
  for(const k in o.ev){
    if(!re.test(k)||!Array.isArray(o.ev[k]))continue;
    const l=o.ev[k].filter(x=>x&&typeof x.t==='string'&&x.t).map(x=>({t:x.t.slice(0,200),time:typeof x.time==='string'?x.time.slice(0,5):''}));
    if(l.length)e[k]=l;
  }
  return {data:d,ev:e};
}
$('export').onclick=exportBackup;
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let r=null;
  try{r=clean(JSON.parse(await f.text()));}catch(err){}
  if(!r){msg('このファイルは読み込めません');return;}
  const n=Object.keys(r.data).length,m=Object.values(r.ev).reduce((t,l)=>t+l.length,0);
  if(!await ask('今のデータを置き換えて読み込みますか?\n(シフト'+n+'日・予定'+m+'件)','読み込む'))return;
  prev={data,ev};savePrev();
  data=r.data;ev=r.ev;save();render();msg('読み込みました');
};
$('undo').onclick=async()=>{
  if(!prev)return;
  if(!await ask('読み込む前のデータに戻しますか?\n今のデータは置き換わります。','戻す'))return;
  data=prev.data;ev=prev.ev;prev=null;savePrev();save();render();msg('戻しました');
};

$('auto').checked=auto;
$('auto').onchange=e=>{auto=e.target.checked;save();};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
